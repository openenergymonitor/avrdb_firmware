[platformio]
default_envs = Upload_USART
src_dir = .

[env]
platform = atmelmegaavr
framework = arduino
board = AVR128DB48
platform_packages =             ; Compiles without this set?
  ; DxCore AVD-DB
  platformio/framework-arduino-megaavr-dxcore@1.5.6  ; pinned, ^1.5.6 would resolve to 1.6.2
  
board_build.f_cpu = 24000000L   ; 24 MHz
board_hardware.oscillator = crystal   ; 24 MHz external crystal (CLOCK_SOURCE=1), "external" would be an external clock input
board_hardware.mvio_enable = yes     ; MultiVoltage I/O enabled (-DMVIO_ENABLED), matches Arduino IDE default

board_hardware.uart = uart3     ; May not be required? 
monitor_speed = 115200

build_flags = -DUSING_OPTIBOOT  ; Upload via uart
upload_protocol = arduino
upload_speed = 115200
upload_flags = -v               ; Verbose

lib_deps =
  https://github.com/openenergymonitor/RFM69_LPL
  https://github.com/openenergymonitor/emonLibDB
  https://github.com/openenergymonitor/emonEProm#avrdb
  https://github.com/greiman/SSD1306Ascii

[env:Upload_USART]
; Uses the settings in the .ino source, for development: pio run -t upload

; ------------------------------------------------------------------------
; Pre-compiled firmware variants, built by ../build.sh
; The env name is used as the hex file name: <env>_v<version>.ino.hex
; ------------------------------------------------------------------------

[emonTx4]
build_flags = ${env.build_flags} -DEMONTX4

[emonTx5]
build_flags = ${env.build_flags} -DEMONTX5

[emonPi2]
build_flags = ${env.build_flags} -DEMONPI2 -DTWI_USING_WIRE1  ; OLED on Wire1, Arduino IDE: "2x Wire"

[env:emonTx4_DB_12CT_1phase_LPL]
build_flags = ${emonTx4.build_flags} -DNUM_V_CHANNELS=1

[env:emonTx5_DB_12CT_1phase_LPL]
build_flags = ${emonTx5.build_flags} -DNUM_V_CHANNELS=1

[env:emonPi2_DB_12CT_1phase_LPL]
build_flags = ${emonPi2.build_flags} -DNUM_V_CHANNELS=1

[env:emonTx4_DB_12CT_3phase_LPL]
build_flags = ${emonTx4.build_flags} -DNUM_V_CHANNELS=3

[env:emonTx5_DB_12CT_3phase_LPL]
build_flags = ${emonTx5.build_flags} -DNUM_V_CHANNELS=3

[env:emonPi2_DB_12CT_3phase_LPL]
build_flags = ${emonPi2.build_flags} -DNUM_V_CHANNELS=3
