[platformio]
default_envs = default
src_dir = .

[env]
platform = atmelmegaavr
framework = arduino
board = AVR128DB48
platform_packages =             ; Compiles without this set?
  ; DxCore AVD-DB
  platformio/framework-arduino-megaavr-dxcore@1.5.6  ; pinned, ^1.5.6 would resolve to 1.6.2
  
board_build.f_cpu = 24000000L   ; 24 MHz
board_hardware.oscillator = crystal   ; 24 MHz external crystal (CLOCK_SOURCE=1), "external" would be an external clock input
board_hardware.mvio_enable = yes     ; MultiVoltage I/O enabled (-DMVIO_ENABLED), matches Arduino IDE default

board_hardware.uart = uart3     ; May not be required? 
monitor_speed = 115200

build_flags = -DUSING_OPTIBOOT  ; Upload via uart
upload_protocol = arduino
upload_speed = 115200
upload_flags = -v               ; Verbose

lib_deps =
  https://github.com/SpenceKonde/OneWire.git#36e2604
  https://github.com/openenergymonitor/RFM69_LPL.git#199811e
  https://github.com/openenergymonitor/emonEProm#avrdb
  https://github.com/openenergymonitor/EmonLibCM#avrdb
  https://github.com/openenergymonitor/RFM69_JeeLib.git#a2e092b
  https://github.com/greiman/SSD1306Ascii

[env:default]
; Uses the settings in the .ino source, for development: pio run -t upload

; ------------------------------------------------------------------------
; Pre-compiled firmware variants, built by ../build.sh
; The env name is used as the hex file name: <env>_v<version>.ino.hex
; ------------------------------------------------------------------------

[emonTx4]
build_flags = ${env.build_flags} -DEMONTX4

[emonTx5]
build_flags = ${env.build_flags} -DEMONTX5

[emonPi2]
build_flags = ${env.build_flags} -DEMONPI2 -DTWI_USING_WIRE1  ; OLED on Wire1, Arduino IDE: "2x Wire"

; Pulse input: 1 = digital (emonTx4), 3 = analog input (emonTx5 & emonPi2 default)
; Analog & digital variants use the analog input, so pulse moves to 1

[env:emonTx4_CM_6CT_temperature_LPL]
build_flags = ${emonTx4.build_flags} -DPULSE_PIN=1

[env:emonTx5_CM_6CT_temperature_LPL]
build_flags = ${emonTx5.build_flags} -DPULSE_PIN=3

[env:emonPi2_CM_6CT]
build_flags = ${emonPi2.build_flags} -DPULSE_PIN=3

[env:emonTx4_CM_6CT_temperature_analog_LPL]
build_flags = ${emonTx4.build_flags} -DPULSE_PIN=1 -DENABLE_ANALOG

[env:emonTx5_CM_6CT_temperature_analog_LPL]
build_flags = ${emonTx5.build_flags} -DPULSE_PIN=1 -DENABLE_ANALOG

[env:emonPi2_CM_6CT_analog]
build_flags = ${emonPi2.build_flags} -DPULSE_PIN=1 -DENABLE_ANALOG

[env:emonTx4_CM_6CT_temperature_digital_LPL]
build_flags = ${emonTx4.build_flags} -DPULSE_PIN=1 -DENABLE_DIGITAL_ON_ANALOG -DINVERT_DIGITAL

[env:emonTx5_CM_6CT_temperature_digital_LPL]
build_flags = ${emonTx5.build_flags} -DPULSE_PIN=1 -DENABLE_DIGITAL_ON_ANALOG -DINVERT_DIGITAL

[env:emonPi2_CM_6CT_digital]
build_flags = ${emonPi2.build_flags} -DPULSE_PIN=1 -DENABLE_DIGITAL_ON_ANALOG -DINVERT_DIGITAL

[env:emonTx4_CM_6CT_temperature_JeeLib_Classic]
build_flags = ${emonTx4.build_flags} -DPULSE_PIN=1 -DRFM69_JEELIB_CLASSIC
